[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dssrr"
version = "0.1.0"
description = "Dual-Sided Spectral Reference Reconstruction: training-free long-gap repair for planetary/seismic time series"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [
    {name = "Shipeng Yu", email = "ysp@cug.edu.cn"}
]
keywords = [
    "seismology", "lunar seismology", "apollo", "signal processing",
    "gap filling", "spectral reconstruction", "planetary science",
    "time series", "artifact removal"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

# ---------------------------------------------------------------------------
# Dependencies
#
# The *core* algorithm (dssrr.core / spectral / synthesizer / verifier) needs
# nothing but numpy + scipy, so a plain `pip install dssrr` stays lightweight.
# The desktop GUI and the batch pipeline pull in heavier packages and are
# therefore opt-in extras:
#
#   pip install dssrr[gui]     # desktop application
#   pip install dssrr[batch]   # command-line batch repair
#   pip install dssrr[all]     # everything except the optional torch backend
#   pip install dssrr[nn]      # optional neural inpainting backend (torch)
# ---------------------------------------------------------------------------
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.optional-dependencies]
gui = [
    "PyQt5>=5.15",
    "matplotlib>=3.5",
    "obspy>=1.4",
    "pandas>=1.3",
]
batch = [
    "obspy>=1.4",
    "pandas>=1.3",
]
nn = [
    "torch>=1.12",
]
dev = [
    "pytest>=7",
    "build>=0.10",
    "twine>=4.0",
]
all = [
    "PyQt5>=5.15",
    "matplotlib>=3.5",
    "obspy>=1.4",
    "pandas>=1.3",
]

[project.scripts]
dssrr-gui = "dssrr.gui.main:main"
dssrr-batch = "dssrr.cli:main"

[project.urls]
Homepage = "https://github.com/YSP0Github/DSSRR"
Documentation = "https://github.com/YSP0Github/DSSRR#readme"
"Source Code" = "https://github.com/YSP0Github/DSSRR"
"Bug Tracker" = "https://github.com/YSP0Github/DSSRR/issues"

[tool.setuptools.packages.find]
include = ["dssrr*"]

[tool.setuptools.package-data]
# Application icon assets (SVG master + multi-size PNG + ICO) must ship with
# the package, otherwise an installed copy falls back to the letter placeholder
# and the window has no icon.
"dssrr.gui.icons" = ["*.svg", "*.png", "*.ico"]
# Apollo moonquake catalogue used for event protection.  Without these files the
# moonquake-protection feature silently degrades to "no catalogue", so they are
# part of the distribution rather than an optional download.
"dssrr.repair_lib" = [
    "moonquake_catalog.json",
    "apollo_catalog/*.csv",
]

[tool.pytest.ini_options]
# Keep the test suite self-contained: without this, pytest running inside the
# DSSRR folder would walk up and pick the parent project's pytest.ini.
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
